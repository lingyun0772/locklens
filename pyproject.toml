[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locklens"
version = "0.1.0"
description = "Read-only health inspector for local agent runtimes: find orphaned session locks, duplicate processes, and port conflicts before they break your agents."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["agent", "lock", "diagnostics", "openclaw", "hermes", "portable"]
authors = [{ name = "locklens contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
locklens = "locklens.cli:main"

[tool.setuptools]
packages = ["locklens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
